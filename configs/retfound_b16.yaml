# AI4C ÑµÁ·ÅäÖÃ£ºRETFound MAE + LoRA ¸ßÐ§Î¢µ÷
# ÓÃÓÚ DDR 5 ·ÖÀà£¨No DR / Mild / Moderate / Severe / Proliferative£©

model:
  name: retfound_mae            # ×ß RETFoundClassifier£¨LoRA °æ£©
  num_classes: 5
  retfound_weights: /root/autodl-tmp/RETFound/RETFound_mae_natureCFP.pth
  dropout: 0.1
  hidden_dim: 1024

# === LoRA ÅäÖÃ ===
lora:
  r: 8                          # LoRA ÖÈ
  alpha: 16                     # LoRA Ëõ·ÅÏµÊý (alpha/r = 2.0)
  dropout: 0.05

data:
  root: /root/autodl-tmp/AI4C/algo/data/DDR_real
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0
  classes:
    0: "No DR"
    1: "Mild NPDR"
    2: "Moderate NPDR"
    3: "Severe NPDR"
    4: "Proliferative DR"
  img_size: 224
  batch_size: 96
  num_workers: 10
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  augment: strong

train:
  optimizer: adamw
  lr: 1e-4                      # ÆäËû¿ÉÑµ²ã
  lora_lr: 1e-4                 # LoRA ÅÔÂ·£¨Óë lr Í¬Á¿¼¶£¬LoRA ±ê×¼×ö·¨£©
  head_lr: 1e-3                 # ·ÖÀàÍ·£¨×î´ó£©
  weight_decay: 0.05
  epochs: 20
  warmup_epochs: 2
  scheduler: cosine
  min_lr: 1e-6
  loss: ce
  label_smoothing: 0.1
  use_class_weight: true
  early_stop_patience: 8
  amp: true
  grad_accum: 1
  grad_clip: 1.0

output:
  ckpt_dir: /root/autodl-tmp/AI4C/algo/runs
  log_dir: /root/autodl-tmp/AI4C/algo/runs/logs

metrics:
  - accuracy
  - quadratic_kappa
  - auc_ovr
  - per_class_precision
  - per_class_recall

seed: 42
