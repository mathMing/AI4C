# AI4C 训练配置
# DR 5-class classification with ViT-B/16

model:
  name: vit_b_16               # torchvision 模型
  num_classes: 5               # DR 0-4
  pretrained: true             # ImageNet1K 预训练
  dropout: 0.1
  hidden_dim: 768

data:
  # 数据集根目录
  root: /root/autodl-tmp/AI4C/algo/data
  # 训练/验证/测试比例（若从原始 csv 自动划分）
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  # 类别（DR 5-class）
  classes:
    0: "No DR"
    1: "Mild NPDR"
    2: "Moderate NPDR"
    3: "Severe NPDR"
    4: "Proliferative DR"
  # 图像大小
  img_size: 224
  # DataLoader
  batch_size: 32
  num_workers: 4
  pin_memory: true
  # 增强强度
  augment: strong              # mild | strong

train:
  # 优化器
  optimizer: adamw
  lr: 1e-4                     # 骨干
  head_lr: 1e-3                # head（比骨干快 10x）
  weight_decay: 0.05
  # 调度
  epochs: 20
  warmup_epochs: 2
  scheduler: cosine
  min_lr: 1e-6
  # 损失
  loss: ce                     # cross-entropy
  label_smoothing: 0.1
  # 类别不均衡
  use_class_weight: true
  # 早停
  early_stop_patience: 5
  # 混合精度
  amp: true
  # 梯度累积
  grad_accum: 1
  # 梯度裁剪
  grad_clip: 1.0

# 输出
output:
  ckpt_dir: /root/autodl-tmp/AI4C/algo/runs
  log_dir: /root/autodl-tmp/AI4C/algo/runs/logs

# 评估指标
metrics:
  - accuracy
  - quadratic_kappa
  - auc_ovr
  - per_class_precision
  - per_class_recall

# 随机种子
seed: 42
